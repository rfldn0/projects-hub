[package]
name = "projects-hub"
version = "0.1.0"
edition = "2021"
description = "Static site generator for a personal project index"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
